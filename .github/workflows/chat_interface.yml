name: Mobile Chat Interface

on:
  issues:
    types: [opened, labeled]

jobs:
  process-chat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process Chat Command
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$ISSUE_TITLE" == *"/listened"* ]]; then
            python -c "import os, agent; parts = os.environ.get('ISSUE_BODY', '').split('|'); agent.check_off_piece(parts[0].strip(), parts[1].strip()) if len(parts) >= 2 else None"
          else
            export AGENT_ACTION="recommend"
            export USER_QUERY="$ISSUE_TITLE $ISSUE_BODY"
            python agent.py
          fi

      - name: Commit Updated Pages & Markdown
        run: |
          git config --global user.name "classical-bot[bot]"
          git config --global user.email "bot@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update music pages and checkoff status"
          git push

      - name: Close Issue with Response
        uses: peter-evans/close-issue@v3
        with:
          comment: "Recommendation generated and GitHub Pages updated!"